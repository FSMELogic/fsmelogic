  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0e1118;
      --bg2:    #141822;
      --card:   #181f2e;
      --steel:  #1c2438;
      --border: #242e42;
      --bord2:  #2e3a52;
      --blue:   #3d8ef0;
      --blue2:  #2d6fd0;
      --cyan:   #5bb8d4;
      --gold:   #c9a84c;
      --text:   #c5d2e8;
      --muted:  #6e86a8;
      --dim:    #3a4a62;
      --head:   'Barlow Condensed', sans-serif;
      --mono:   'IBM Plex Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 16px; line-height: 1.7; min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(61,142,240,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(61,142,240,0.018) 1px, transparent 1px);
      background-size: 52px 52px;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
    }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 500; background: rgba(8,10,16,0.96); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 rgba(61,142,240,0.12); }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 2rem; }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .nav-logo img { height: 42px; width: 42px; object-fit: contain; border-radius: 4px; }
    .nav-logo-text { font-family: var(--mono); font-weight: 700; font-size: 1rem; color: var(--blue); letter-spacing: 0.1em; }
    .nav-links { display: flex; list-style: none; align-items: center; gap: 0.25rem; }
    .nav-links a { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.45rem 0.9rem; transition: color 0.2s, background 0.2s; }
    .nav-links a:hover { color: var(--blue); background: rgba(61,142,240,0.08); }
    .nav-links .nav-cta a { color: var(--blue); border: 1px solid rgba(61,142,240,0.5); padding: 0.45rem 1rem; }
    .nav-links .nav-cta a:hover { background: var(--blue); color: #fff; }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 0.5rem; background: none; border: none; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--muted); transition: all 0.3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; flex-direction: column; background: rgba(8,10,16,0.98); border-top: 1px solid var(--border); padding: 1rem 2rem 1.5rem; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.85rem 0; border-bottom: 1px solid var(--border); transition: color 0.2s; }
    .mobile-menu a:hover { color: var(--blue); }
    .mobile-menu a:last-child { color: var(--blue); border-bottom: none; margin-top: 0.5rem; }

    section, .wrap { position: relative; z-index: 1; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 5rem 2rem; }
    .section-label { font-family: var(--mono); font-size: 0.72rem; color: var(--blue); letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
    .section-label::before { content: '//'; color: var(--dim); }
    .section-title { font-family: var(--head); font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: #dde6f5; line-height: 1.05; margin-bottom: 1.25rem; }
    .section-title em { font-style: normal; color: var(--blue); }
    .section-sub { font-family: var(--mono); font-size: 0.95rem; color: var(--muted); max-width: 640px; line-height: 1.9; margin-bottom: 3rem; }

    /* HERO */
    .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 8rem 2rem 5rem; position: relative; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 60% at 60% 40%, rgba(61,142,240,0.07) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 15% 75%, rgba(91,184,212,0.04) 0%, transparent 60%); }
    .hero-inner { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
    .hero-eyebrow { font-family: var(--mono); font-size: 0.75rem; color: var(--blue); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; animation: fadeUp 0.5s ease both; }
    .hero-eyebrow::before { content: '▸'; }
    .hero h1 { font-family: var(--head); font-size: clamp(3.2rem, 9vw, 7rem); font-weight: 800; line-height: 0.93; color: #dde6f5; margin-bottom: 2rem; animation: fadeUp 0.5s 0.1s ease both; }
    .hero h1 em { font-style: normal; color: var(--blue); }
    .hero h1 .dim { color: var(--muted); }
    .hero-quote { font-family: var(--mono); font-size: clamp(0.9rem, 1.8vw, 1.1rem); color: var(--muted); max-width: 640px; line-height: 1.9; border-left: 3px solid var(--blue); padding-left: 1.5rem; margin-bottom: 2.5rem; animation: fadeUp 0.5s 0.2s ease both; }
    .hero-quote strong { color: var(--text); display: block; margin-top: 0.75rem; font-size: 0.78rem; letter-spacing: 0.06em; }
    .hero-stats { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 3rem; animation: fadeUp 0.5s 0.3s ease both; }
    .hero-stat { background: var(--card); border: 1px solid var(--border); border-top: 2px solid var(--blue); padding: 1.25rem 1.75rem; min-width: 150px; }
    .hero-stat .val { font-family: var(--head); font-size: 2.8rem; font-weight: 800; color: var(--blue); line-height: 1; }
    .hero-stat .val.gold { color: var(--gold); }
    .hero-stat .lbl { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.3rem; line-height: 1.5; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 1rem; animation: fadeUp 0.5s 0.4s ease both; }

    .btn { font-family: var(--mono); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 1rem 2rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.6rem; transition: all 0.2s; }
    .btn-primary { background: var(--blue); color: #fff; border: 2px solid var(--blue); }
    .btn-primary:hover { background: var(--blue2); border-color: var(--blue2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(61,142,240,0.3); }
    .btn-secondary { background: transparent; color: var(--text); border: 2px solid var(--bord2); }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }

    /* PROBLEM */
    .bg-alt { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .prob-card { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--bord2); padding: 2rem; }
    .prob-card h3 { font-family: var(--head); font-size: 1.4rem; font-weight: 700; color: #dde6f5; margin-bottom: 0.75rem; }
    .prob-card p { font-family: var(--mono); font-size: 0.87rem; color: var(--muted); line-height: 1.85; }

    /* WHAT WE DO */
    .grid-3-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.5rem; }
    .what-card { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--blue); padding: 2.25rem; transition: transform 0.2s, box-shadow 0.2s; }
    .what-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); }
    .what-icon { font-size: 1.7rem; margin-bottom: 1.1rem; }
    .what-card h3 { font-family: var(--head); font-size: 1.45rem; font-weight: 700; color: #dde6f5; margin-bottom: 0.7rem; }
    .what-card p { font-family: var(--mono); font-size: 0.86rem; color: var(--muted); line-height: 1.85; }

    /* INFOGRAPHIC SPLIT */
    .info-split { display: flex; align-items: center; gap: 4rem; }
    .info-text { flex: 1; min-width: 260px; }
    .info-text h2 { font-family: var(--head); font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; color: #dde6f5; line-height: 1.05; margin-bottom: 1.25rem; }
    .info-text p { font-family: var(--mono); font-size: 0.9rem; color: var(--muted); line-height: 1.9; margin-bottom: 1.25rem; }
    .info-img { flex: 1; min-width: 240px; max-width: 460px; }
    .info-img img { width: 100%; height: auto; display: block; border: 1px solid var(--border); }

    /* VALIDATION CARDS */
    .val-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .val-card { background: var(--steel); border: 1px solid var(--border); padding: 2.25rem; position: relative; overflow: hidden; }
    .val-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .val-card .src { font-family: var(--mono); font-size: 0.67rem; color: var(--blue); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.75rem; }
    .val-card .metric { font-family: var(--head); font-size: 2.8rem; font-weight: 800; color: #dde6f5; line-height: 1; margin-bottom: 0.4rem; }
    .val-card .metric-lbl { font-family: var(--head); font-size: 1.1rem; font-weight: 600; color: var(--blue); margin-bottom: 0.75rem; }
    .val-card p { font-family: var(--mono); font-size: 0.84rem; color: var(--muted); line-height: 1.8; }

    /* TABLE */
    .tbl-wrap { overflow-x: auto; margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 1rem 1.25rem; text-align: left; border-bottom: 2px solid var(--border); }
    th:first-child { color: var(--dim); }
    th:nth-child(2) { color: var(--muted); }
    th:last-child { color: var(--blue); background: rgba(61,142,240,0.06); }
    td { font-family: var(--mono); font-size: 0.84rem; color: var(--muted); padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    td:first-child { color: var(--text); font-weight: 500; }
    td:last-child { background: rgba(61,142,240,0.04); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    .tag-bad { display: inline-block; font-size: 0.7rem; padding: 0.2rem 0.55rem; background: rgba(180,60,60,0.14); color: #e08080; border: 1px solid rgba(180,60,60,0.28); }
    .tag-good { display: inline-block; font-size: 0.7rem; padding: 0.2rem 0.55rem; background: rgba(61,142,240,0.12); color: var(--blue); border: 1px solid rgba(61,142,240,0.3); }

    /* PROCESS */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border: 1px solid var(--border); margin-top: 2rem; }
    .step { padding: 2.25rem; border-right: 1px solid var(--border); }
    .step:last-child { border-right: none; }
    .step-num { font-family: var(--head); font-size: 4rem; font-weight: 800; color: rgba(61,142,240,0.12); line-height: 1; margin-bottom: 1rem; }
    .step h3 { font-family: var(--head); font-size: 1.3rem; font-weight: 700; color: #dde6f5; margin-bottom: 0.6rem; }
    .step p { font-family: var(--mono); font-size: 0.84rem; color: var(--muted); line-height: 1.8; }

    /* CTA */
    .cta { background: var(--steel); border-top: 1px solid var(--border); text-align: center; padding: 6rem 2rem; position: relative; overflow: hidden; }
    .cta::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(61,142,240,0.06) 0%, transparent 70%); pointer-events: none; }
    .cta h2 { font-family: var(--head); font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 800; color: #dde6f5; margin-bottom: 1rem; position: relative; }
    .cta p { font-family: var(--mono); font-size: 0.95rem; color: var(--muted); max-width: 520px; margin: 0 auto 2.5rem; line-height: 1.9; position: relative; }
    .cta-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; position: relative; }

    /* FOOTER */
    footer { background: #080a10; border-top: 1px solid var(--border); padding: 2.5rem 2rem; position: relative; z-index: 1; }
    .foot-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .foot-left { font-family: var(--mono); font-size: 0.77rem; color: var(--dim); line-height: 1.8; }
    .foot-left a { color: var(--blue); text-decoration: none; }
    .foot-right { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .foot-right a { font-family: var(--mono); font-size: 0.73rem; color: var(--dim); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; }
    .foot-right a:hover { color: var(--blue); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .info-split { flex-direction: column; }
      .info-img { max-width: 100%; }
      .steps { grid-template-columns: 1fr 1fr; }
      .step { border-right: none; border-bottom: 1px solid var(--border); }
      .step:last-child { border-bottom: none; }
    }
    @media (max-width: 680px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .wrap { padding: 3.5rem 1.25rem; }
      .hero { padding: 7rem 1.25rem 4rem; }
      .hero-stats { gap: 1rem; }
      .hero-stat { min-width: 130px; padding: 1rem 1.25rem; }
      .hero-stat .val { font-size: 2.2rem; }
      .steps { grid-template-columns: 1fr; }
      .step { border-right: none; border-bottom: 1px solid var(--border); }
      td, th { padding: 0.75rem; font-size: 0.75rem; }
      .cta { padding: 4rem 1.25rem; }
      footer { padding: 2rem 1.25rem; }
      .foot-inner { flex-direction: column; align-items: flex-start; }
    }

    .foot-social { display: flex; align-items: center; gap: 1rem; }
    .foot-social a { color: var(--dim); transition: color 0.2s; display: flex; align-items: center; }
    .foot-social a:hover { color: var(--blue); }
  </style>

    <p class="hero-eyebrow">Predictive Integrity Engine — Edmonto

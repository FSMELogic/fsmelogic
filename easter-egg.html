<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSME Logic // The Origin</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0e1118;
            --accent-blue: #3d8ef0;
            --accent-cyan: #5bb8d4;
            --accent-gold: #c9a84c;
            --text-grey: #a0aabf;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-grey);
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Scanline Pseudo-element Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Grid Texture Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(61, 142, 240, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61, 142, 240, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            pointer-events: none;
        }

        #game-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100vh;
        }

        header {
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(201, 168, 76, 0.3);
        }

        .sys-status {
            color: var(--accent-cyan);
            font-size: 0.8rem;
        }

        /* The Graphic/Status UI */
        #visual-interface {
            border: 1px solid var(--accent-blue);
            background: rgba(14, 17, 24, 0.8);
            padding: 15px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .highlight { color: var(--accent-cyan); }
        .gold-text { color: var(--accent-gold); }

        /* The Story Output */
        #story-console {
            flex-grow: 1;
            border: 1px solid var(--accent-blue);
            background: #080a0e;
            padding: 20px;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .story-entry {
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Action Buttons */
        #action-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            flex: 1 1 calc(50% - 10px); /* Mobile friendly: 2 columns */
            background-color: transparent;
            color: var(--accent-cyan);
            font-family: 'IBM Plex Mono', monospace;
            border: 1px solid var(--accent-cyan);
            padding: 15px;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        button:disabled {
            border-color: #333;
            color: #555;
            cursor: not-allowed;
        }

        /* System Controls (Save/Load/Socials) */
        footer {
            border-top: 1px dashed var(--accent-blue);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .sys-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .sys-buttons button {
            flex: 0 1 auto;
            padding: 8px 15px;
            font-size: 0.8rem;
            border-color: var(--text-grey);
            color: var(--text-grey);
        }

        .social-links a {
            color: var(--accent-blue);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--accent-gold);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            button { flex: 1 1 100%; } /* Stack buttons on very small screens */
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <header>
        <h1>FSME LOGIC</h1>
        <div class="sys-status" id="location-display">LOC: EDMONTON_LAB</div>
    </header>

    <div id="visual-interface">
        <div class="status-row">
            <span>TRACK 1 [BUSINESS]: <span id="bus-status" class="text-grey">IDLE</span></span>
            <span>TRACK 2 [SCIENCE]: <span id="sci-status" class="text-grey">THEORY</span></span>
        </div>
        <div class="status-row">
            <span>HARDWARE: <span id="hw-status" class="highlight">DELL INSPIRON 3880</span></span>
            <span>FUNDS: <span id="funds-status" class="gold-text">$0.00 CAD</span></span>
        </div>
        <div id="inventory-display" style="margin-top: 10px; font-size: 0.8rem; color: var(--accent-gold);">
            INV: [PIXEL 8]
        </div>
    </div>

    <div id="story-console">
        </div>

    <div id="action-panel">
        </div>

    <footer>
        <div class="sys-buttons">
            <button onclick="saveGame()">Save State</button>
            <button onclick="loadGame()">Load State</button>
            <button onclick="resetGame()" style="border-color: #883333; color: #883333;">Reset</button>
        </div>
        <div class="social-links">
            <a href="https://x.com/FsmeLogic" target="_blank">X (Twitter)</a> | 
            <a href="https://youtube.com/@fsmelogic" target="_blank">YouTube</a> | 
            <a href="https://www.linkedin.com/in/fsmelogic" target="_blank">LinkedIn</a> | 
            <a href="mailto:alex-kalyniuk@fsmelogic.ca">Contact</a>
        </div>
    </footer>
</div>

<script>
    /* --- GAME ENGINE & STATE --- */
    
    // Default starting state
    const initialState = {
        location: 'desk',
        funds: 0,
        inventory: ['Dell PC', 'Raspberry Pi Zero W'],
        flags: {
            watchedVideo: false,
            uipFormalized: false,
            boxBuilt: false,
            ghostProtocol: false,
            engineCoded: false,
            gsaValidated: false,
            pitchSent: false,
            contractSigned: false
        }
    };

    let state = JSON.parse(JSON.stringify(initialState));

    // UI Elements
    const storyConsole = document.getElementById('story-console');
    const actionPanel = document.getElementById('action-panel');
    const locDisplay = document.getElementById('location-display');
    const busStatus = document.getElementById('bus-status');
    const sciStatus = document.getElementById('sci-status');
    const hwStatus = document.getElementById('hw-status');
    const fundsStatus = document.getElementById('funds-status');
    const invDisplay = document.getElementById('inventory-display');

    /* --- STORY DATA --- */
    // This object acts as the map and narrative controller.
    const storyNodes = {
        'desk': {
            title: 'LOC: APARTMENT_DESK',
            render: () => {
                let text = "It's late in Edmonton. You're sitting at your Dell Inspiron 3880. ";
                if (!state.flags.watchedVideo) {
                    text += "You just finished watching a deep-dive astrophysics video on YouTube. The host was talking about the vacuum of space. Something clicked. What if the vacuum isn't empty? With this surge of energy you realize It's time to build.";
                } else if (!state.flags.uipFormalized) {
                    text += "The Unified Information Potential (UIP) concept is burning in your mind. The math needs to be written down.";
                } else if (!state.flags.engineCoded) {
                    text += "The theory is solid. Now you need to turn the math into a commercial anomaly detection engine—Finite-State Memory Embedding (FSME).";
                } else {
                    text += "The desk is covered in notes, hardware, and empty coffee cups. The FSME engine is compiled.";
                }
                return text;
            },
            actions: () => {
                let btns = [];
                if (!state.flags.watchedVideo) {
                    btns.push({ label: "Ponder the Vacuum", action: () => { state.flags.watchedVideo = true; appendStory("The realization hits: healthy systems have elastic micro-fluctuations. Degrading systems lose that elasticity. Entropy collapses."); updateUI(); }});
                }
                if (state.flags.watchedVideo && !state.flags.uipFormalized) {
                    btns.push({ label: "Formalize UIP Theory", action: () => { state.flags.uipFormalized = true; appendStory("You write out the equations. You derive a theoretical constant before running any hardware. This is the foundation."); updateUI(); }});
                }
                if (state.flags.uipFormalized && !state.flags.engineCoded) {
                    btns.push({ label: "Code FSME in Python", action: () => { state.flags.engineCoded = true; appendStory("You code the kernel. Test it on real world data. It detects when a system stops behaving like itself."); updateUI(); }});
                }
                
                // Navigation
                btns.push({ label: "Go to Kitchen (Hardware)", action: () => { state.location = 'kitchen'; updateUI(); }});
                
                if (state.flags.engineCoded) {
                    btns.push({ label: "Go to Comms Terminal", action: () => { state.location = 'comms'; updateUI(); }});
                }
                return btns;
            }
        },
        'kitchen': {
            title: 'LOC: KITCHEN_LAB',
            render: () => {
                let text = "The kitchen. To prove UIP, you need to measure vacuum drag ratio using the Pi Zero w. But environmental noise (vibration, RF, acoustic) will ruin the data.";
                if (!state.flags.boxBuilt) {
                    text += " You need to build a 'MacGyver Box' isolation chamber out of household items.";
                } else if (!state.flags.ghostProtocol) {
                    text += " The triple-layer Marushka Doll enclosure is built: Unplugged microwave, ice packs, steel lunchbox. Now the Pi Zero needs to be digitally isolated.";
                } else {
                    text += " The Pi Zero is sealed inside the microwave, running at the Electronic Floor. The experiment is silently logging data.";
                }
                return text;
            },
            actions: () => {
                let btns = [];
                if (!state.flags.boxBuilt) {
                    btns.push({ label: "Assemble MacGyver Box 3.0", action: () => { 
                        state.flags.boxBuilt = true; 
                        state.inventory.push('Microwave Faraday Cage');
                        appendStory("You nest a steel lunchbox wrapped in foil inside an unplugged microwave with ice packs and sponges. A DIY Faraday cage."); 
                        updateUI(); 
                    }});
                }
                if (state.flags.boxBuilt && !state.flags.ghostProtocol) {
                    btns.push({ label: "Execute Ghost Protocol", action: () => { 
                        state.flags.ghostProtocol = true; 
                        appendStory("You kill all background daemons on the Pi. Wi-Fi off. Bluetooth off. No network. The OS is in a Coma State. The experiment begins."); 
                        updateUI(); 
                    }});
                }
                btns.push({ label: "Return to Desk", action: () => { state.location = 'desk'; updateUI(); }});
                return btns;
            }
        },
        'comms': {
            title: 'LOC: COMMS_TERMINAL',
            render: () => {
                let text = "The commercial front. You have a working FSME algorithm. You need to validate it on public datasets to prove it works before pitching to aerospace companies.";
                if (!state.flags.gsaValidated) {
                    text += " The Global Space Agency (GSA) has public robotic rover telemetry available.";
                } else if (!state.flags.pitchSent) {
                    text += " Validation complete. It's time to approach AeroDrake Space, a local hyperspectral imaging constellation company.";
                } else if (!state.flags.contractSigned) {
                    text += " The email is out. You are waiting for AeroDrake to bite on the $8,000 pilot audit.";
                } else {
                    text += " Contract signed. Funds secured. The business is real. The science is proven.";
                }
                return text;
            },
            actions: () => {
                let btns = [];
                if (!state.flags.gsaValidated) {
                    btns.push({ label: "Audit GSA Rover Data", action: () => { 
                        state.flags.gsaValidated = true; 
                        appendStory("FSME successfully isolates 100% of the mechanical actuator failures in the robotic arm dataset, providing over 6 hours of predictive lead time. Zero false positives."); 
                        updateUI(); 
                    }});
                }
                if (state.flags.gsaValidated && !state.flags.pitchSent) {
                    btns.push({ label: "Pitch AeroDrake Space", action: () => { 
                        state.flags.pitchSent = true; 
                        appendStory("You draft a cold email. 'I've developed a mathematical filter that detects the entropic stiffness in mechanical systems before they fail...' You hit send."); 
                        updateUI(); 
                    }});
                }
                if (state.flags.pitchSent && !state.flags.contractSigned) {
                    btns.push({ label: "Close the Deal", action: () => { 
                        state.flags.contractSigned = true; 
                        state.funds += 8000;
                        appendStory("SUCCESS. They agreed to the 30-day forensic audit. 50% deposit upfront. The two tracks—the physics and the business—have converged. (USE CODE 88 IN E-MAIL FOR 25% OFF PILOT AUDIT, First 3 Customers Only."); 
                        updateUI(); 
                    }});
                }
                btns.push({ label: "Return to Desk", action: () => { state.location = 'desk'; updateUI(); }});
                return btns;
            }
        }
    };

    /* --- CORE FUNCTIONS --- */

    function appendStory(text) {
        const p = document.createElement('p');
        p.className = 'story-entry';
        p.innerText = "> " + text;
        storyConsole.appendChild(p);
        storyConsole.scrollTop = storyConsole.scrollHeight; // Auto-scroll to bottom
    }

    function updateUI() {
        const room = storyNodes[state.location];
        
        // Update Headers
        locDisplay.innerText = room.title;
        fundsStatus.innerText = `$${state.funds.toLocaleString()} CAD`;
        invDisplay.innerText = `INV: [${state.inventory.join('] [')}]`;

        // Update Track Statuses
        sciStatus.innerText = state.flags.ghostProtocol ? "ACTIVE MEASUREMENT" : (state.flags.uipFormalized ? "FORMALIZED" : "THEORY");
        sciStatus.className = state.flags.ghostProtocol ? "highlight" : "text-grey";
        
        busStatus.innerText = state.flags.contractSigned ? "CONTRACT SECURED" : (state.flags.engineCoded ? "ENGINE COMPILED" : "IDLE");
        busStatus.className = state.flags.contractSigned ? "gold-text" : "text-grey";

        // Render Room Text
        appendStory(room.render());

        // Render Buttons
        actionPanel.innerHTML = '';
        const actions = room.actions();
        actions.forEach(act => {
            const btn = document.createElement('button');
            btn.innerText = act.label;
            btn.onclick = act.action;
            actionPanel.appendChild(btn);
        });
    }

    /* --- SAVE / LOAD SYSTEM --- */
    function saveGame() {
        localStorage.setItem('fsmeGameState', JSON.stringify(state));
        appendStory("SYSTEM: State saved to local browser storage.");
    }

    function loadGame() {
        const saved = localStorage.getItem('fsmeGameState');
        if (saved) {
            state = JSON.parse(saved);
            storyConsole.innerHTML = ''; // Clear console on load
            appendStory("SYSTEM: Save state restored.");
            updateUI();
        } else {
            appendStory("SYSTEM: No save data found.");
        }
    }

    function resetGame() {
        if(confirm("Are you sure you want to wipe your progress?")) {
            localStorage.removeItem('fsmeGameState');
            state = JSON.parse(JSON.stringify(initialState));
            storyConsole.innerHTML = '';
            appendStory("SYSTEM: Memory wiped. Re-initializing...");
            updateUI();
        }
    }

    // Init Game
    appendStory("SYSTEM BOOT... INITIALIZING FINITE-STATE MEMORY EMBEDDING...");
    updateUI();

</script>
</body>
</html>
